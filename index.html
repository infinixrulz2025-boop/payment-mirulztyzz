<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MIRULZTYZZ STORE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      background: #1a0f0b;
      overflow-x: hidden;
    }

    #intro-loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.8s ease;
      color: #f5f0eb;
      text-align: center;
      padding: 20px;
      background: #1a0f0b;
    }

    #intro-loading.hide {
      opacity: 0;
      pointer-events: none;
    }

    #intro-loading .intro-icon {
      font-size: 4.8rem;
      margin-bottom: 6px;
      animation: pulseIcon 1.8s ease-in-out infinite;
      text-shadow: 0 0 80px rgba(180, 130, 100, 0.3);
      letter-spacing: 8px;
    }

    @keyframes pulseIcon {
      0% { transform: scale(1) rotate(-2deg); opacity: 0.7; }
      50% { transform: scale(1.15) rotate(2deg); opacity: 1; }
      100% { transform: scale(1) rotate(-2deg); opacity: 0.7; }
    }

    #intro-loading h1 {
      font-size: 4.6rem;
      font-weight: 900;
      letter-spacing: 10px;
      background: linear-gradient(135deg, #f5e6d3 0%, #d7ccc8 40%, #bcaaa4 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.1;
    }

    #intro-loading .sub-title {
      font-size: 1.4rem;
      font-weight: 400;
      color: #bcaaa4;
      letter-spacing: 14px;
      margin-top: 10px;
      text-transform: uppercase;
    }

    #intro-loading .loader-container {
      margin-top: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    #intro-loading .loader-track {
      width: 160px;
      height: 3px;
      background: rgba(215, 204, 200, 0.08);
      border-radius: 4px;
      overflow: hidden;
    }

    #intro-loading .loader-track .loader-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #bcaaa4, #f5e6d3, #bcaaa4);
      border-radius: 4px;
      animation: loadBar 4s cubic-bezier(0.65, 0, 0.35, 1) forwards;
    }

    @keyframes loadBar {
      0% { width: 0%; }
      100% { width: 100%; }
    }

    #intro-loading .loader-dots {
      display: flex;
      gap: 10px;
    }

    #intro-loading .loader-dots span {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(215, 204, 200, 0.15);
      animation: dotBounce 1.2s ease-in-out infinite;
    }

    #intro-loading .loader-dots span:nth-child(2) { animation-delay: 0.2s; }
    #intro-loading .loader-dots span:nth-child(3) { animation-delay: 0.4s; }
    #intro-loading .loader-dots span:nth-child(4) { animation-delay: 0.6s; }
    #intro-loading .loader-dots span:nth-child(5) { animation-delay: 0.8s; }

    @keyframes dotBounce {
      0%, 100% { transform: scale(0.6); opacity: 0.3; }
      50% { transform: scale(1.2); opacity: 1; background: #d7ccc8; }
    }

    .bg-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -2;
      overflow: hidden;
      background: #1a0f0b;
    }

    .bg-image {
      position: absolute;
      top: 50%;
      left: 50%;
      min-width: 100%;
      min-height: 100%;
      width: auto;
      height: auto;
      transform: translate(-50%, -50%);
      object-fit: cover;
      filter: brightness(0.45) saturate(0.9);
      opacity: 0;
      transition: opacity 1.5s ease;
    }

    .bg-image.loaded {
      opacity: 1;
    }

    .bg-fallback {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(ellipse at center, #2a1a14 0%, #0d0806 100%);
      z-index: -1;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(ellipse at center, rgba(40, 25, 18, 0.2) 0%, rgba(15, 8, 6, 0.6) 100%);
      z-index: -1;
      backdrop-filter: blur(2px);
    }

    .container {
      max-width: 1100px;
      width: 100%;
      background: rgba(255, 248, 241, 0.04);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 48px;
      padding: 30px 25px 40px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.5);
      border: 1px solid rgba(255, 235, 215, 0.06);
      position: relative;
      z-index: 1;
    }

    .welcome-title {
      text-align: center;
      margin-bottom: 28px;
      color: #f5f0eb;
      text-shadow: 0 4px 40px rgba(0,0,0,0.6);
    }

    .welcome-title .brand-tag {
      font-size: 0.85rem;
      letter-spacing: 6px;
      color: #bcaaa4;
      background: rgba(78, 52, 46, 0.2);
      padding: 6px 24px;
      border-radius: 60px;
      display: inline-block;
      border: 1px solid rgba(255,235,215,0.04);
      margin-bottom: 6px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .welcome-title h2 {
      font-size: 1.6rem;
      font-weight: 400;
      letter-spacing: 6px;
      color: #d7ccc8;
      text-transform: uppercase;
      margin-top: 2px;
    }

    .welcome-title h1 {
      font-size: 3.6rem;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.15;
      text-shadow: 0 4px 50px rgba(0,0,0,0.7);
      margin-top: 2px;
    }

    .welcome-title h1 .highlight {
      background: rgba(78, 52, 46, 0.2);
      padding: 0 24px;
      color: #f5f0eb;
      display: inline-block;
      border-radius: 60px;
      font-size: 3.2rem;
      letter-spacing: 4px;
      border: 1px solid rgba(255,235,215,0.06);
      font-weight: 900;
    }

    .payment-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 25px;
      margin-top: 12px;
    }

    .payment-card {
      background: rgba(255, 248, 241, 0.04);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 32px;
      padding: 20px 18px 22px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      border: 1px solid rgba(255, 235, 215, 0.05);
      transition: all 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      cursor: pointer;
      user-select: none;
      position: relative;
    }

    .payment-card:hover {
      transform: translateY(-6px);
      border-color: rgba(255, 235, 215, 0.15);
      box-shadow: 0 20px 50px rgba(0,0,0,0.35);
      background: rgba(255, 248, 241, 0.08);
    }

    .payment-card .label {
      font-size: 1.1rem;
      font-weight: 700;
      color: #f5f0eb;
      background: rgba(78, 52, 46, 0.2);
      padding: 8px 24px;
      border-radius: 60px;
      border: 1px solid rgba(255,235,215,0.04);
      margin-bottom: 16px;
      width: 100%;
      text-shadow: 0 2px 12px rgba(0,0,0,0.4);
      letter-spacing: 1px;
      font-size: 1rem;
    }

    .payment-card .account-number {
      font-size: 1.9rem;
      font-weight: 700;
      color: #f5f0eb;
      background: rgba(20, 12, 8, 0.15);
      padding: 14px 10px;
      width: 100%;
      border-radius: 60px;
      border: 2px dashed rgba(255,235,215,0.06);
      margin-bottom: 16px;
      word-break: break-all;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 16px rgba(0,0,0,0.5);
    }

    .payment-card .account-number:hover {
      border-color: rgba(255,235,215,0.15);
    }

    .copy-btn {
      background: rgba(78, 52, 46, 0.25);
      border: none;
      color: #f5f0eb;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 12px 32px;
      border-radius: 60px;
      cursor: pointer;
      transition: all 0.15s;
      box-shadow: 0 6px 0 rgba(20, 12, 8, 0.15);
      border: 1px solid rgba(255,235,215,0.04);
      letter-spacing: 1.5px;
      width: fit-content;
    }

    .copy-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 rgba(20, 12, 8, 0.15);
    }

    .copy-btn:hover {
      background: rgba(90, 60, 50, 0.35);
      border-color: rgba(255,235,215,0.1);
    }

    .qr-card .qr-image {
      width: 100%;
      max-width: 210px;
      aspect-ratio: 1/1;
      object-fit: contain;
      border-radius: 24px;
      background: rgba(255, 248, 241, 0.03);
      padding: 8px;
      border: 2px solid rgba(255,235,215,0.04);
      margin: 4px 0 12px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
    }

    .qr-card .qr-image:hover {
      transform: scale(1.04);
      box-shadow: 0 8px 30px rgba(0,0,0,0.3);
      border-color: rgba(255,235,215,0.1);
    }

    .qr-note {
      font-size: 0.8rem;
      color: #bcaaa4;
      background: rgba(78, 52, 46, 0.1);
      padding: 6px 20px;
      border-radius: 40px;
      border: 1px solid rgba(255,235,215,0.03);
      text-shadow: 0 2px 12px rgba(0,0,0,0.3);
      letter-spacing: 0.5px;
      font-weight: 500;
    }

    .card-content {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: all 0.3s ease;
      overflow: hidden;
    }

    .card-content.hidden {
      display: none;
    }

    .toggle-indicator {
      margin-top: 14px;
      font-size: 0.8rem;
      color: #bcaaa4;
      background: rgba(78, 52, 46, 0.1);
      padding: 4px 22px;
      border-radius: 40px;
      border: 1px solid rgba(255,235,215,0.03);
      display: inline-block;
      font-weight: 600;
      text-shadow: 0 2px 12px rgba(0,0,0,0.3);
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .payment-card.toggled .toggle-indicator {
      background: rgba(200, 180, 160, 0.05);
      color: #d7ccc8;
    }

    .bottom-buttons {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 18px;
      z-index: 999;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }

    .whatsapp-btn {
      background: rgba(37, 211, 102, 0.25);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(37, 211, 102, 0.12);
      color: #ffffff;
      padding: 14px 28px;
      border-radius: 60px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 8px 30px rgba(0,0,0,0.25);
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      letter-spacing: 0.5px;
    }

    .whatsapp-btn:hover {
      transform: scale(1.06);
      background: rgba(37, 211, 102, 0.35);
      box-shadow: 0 12px 40px rgba(37, 211, 102, 0.15);
      border-color: rgba(37, 211, 102, 0.2);
    }

    .whatsapp-btn svg {
      width: 22px;
      height: 22px;
      fill: white;
      flex-shrink: 0;
    }

    .qr-popup-overlay {
      position: fixed;
      inset: 0;
      background: rgba(10, 6, 4, 0.85);
      backdrop-filter: blur(18px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      padding: 30px;
    }

    .qr-popup-overlay.open {
      display: flex;
    }

    .qr-popup-box {
      background: rgba(255, 248, 241, 0.04);
      backdrop-filter: blur(24px);
      border-radius: 44px;
      padding: 30px;
      max-width: 650px;
      width: 100%;
      position: relative;
      box-shadow: 0 40px 80px rgba(0,0,0,0.7);
      border: 1px solid rgba(255,235,215,0.06);
      text-align: center;
    }

    .qr-popup-box img {
      width: 100%;
      max-height: 80vh;
      object-fit: contain;
      border-radius: 24px;
      background: rgba(255, 248, 241, 0.02);
      padding: 10px;
      border: 1px solid rgba(255,235,215,0.03);
    }

    .qr-popup-box .close-popup {
      position: absolute;
      top: -14px;
      right: -14px;
      background: rgba(78, 52, 46, 0.6);
      color: #f5f0eb;
      border: none;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      font-size: 1.6rem;
      font-weight: 300;
      cursor: pointer;
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
      transition: 0.2s;
      border: 1px solid rgba(255,235,215,0.06);
      line-height: 1;
    }

    .qr-popup-box .close-popup:hover {
      background: rgba(40, 25, 18, 0.8);
      transform: scale(1.08);
    }

    .toast-msg {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%) translateY(10px);
      background: rgba(30, 18, 12, 0.8);
      backdrop-filter: blur(14px);
      color: #f5f0eb;
      padding: 14px 36px;
      border-radius: 60px;
      font-weight: 600;
      font-size: 1rem;
      box-shadow: 0 12px 40px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,235,215,0.04);
      opacity: 0;
      transition: opacity 0.4s ease, transform 0.4s ease;
      z-index: 9999;
      pointer-events: none;
      text-align: center;
      letter-spacing: 0.5px;
    }

    .toast-msg.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 800px) {
      .payment-grid {
        grid-template-columns: 1fr;
        gap: 28px;
      }
      .welcome-title h1 {
        font-size: 2.8rem;
      }
      .welcome-title h1 .highlight {
        font-size: 2.4rem;
        padding: 0 16px;
      }
      #intro-loading h1 {
        font-size: 3.4rem;
        letter-spacing: 6px;
      }
      #intro-loading .intro-icon {
        font-size: 3.6rem;
      }
      .bottom-buttons {
        bottom: 20px;
        gap: 14px;
      }
      .whatsapp-btn {
        padding: 12px 20px;
        font-size: 0.9rem;
      }
      .toast-msg {
        bottom: 85px;
        padding: 12px 24px;
        font-size: 0.9rem;
      }
    }

    @media (max-width: 480px) {
      .welcome-title .brand-tag {
        font-size: 0.7rem;
        letter-spacing: 4px;
        padding: 4px 16px;
      }
      .welcome-title h2 {
        font-size: 1.2rem;
        letter-spacing: 4px;
      }
      .welcome-title h1 {
        font-size: 2.2rem;
      }
      .welcome-title h1 .highlight {
        font-size: 1.8rem;
        padding: 0 12px;
      }
      .payment-card .account-number {
        font-size: 1.4rem;
        padding: 12px 8px;
      }
      .payment-card .label {
        font-size: 0.9rem;
        padding: 6px 16px;
      }
      .qr-popup-box {
        padding: 16px;
      }
      .bottom-buttons {
        bottom: 14px;
        gap: 10px;
      }
      .whatsapp-btn {
        padding: 10px 16px;
        font-size: 0.8rem;
        gap: 6px;
      }
      .whatsapp-btn svg {
        width: 18px;
        height: 18px;
      }
      .toast-msg {
        bottom: 72px;
        padding: 10px 18px;
        font-size: 0.8rem;
      }
      #intro-loading h1 {
        font-size: 2.6rem;
        letter-spacing: 4px;
      }
      #intro-loading .sub-title {
        font-size: 1rem;
        letter-spacing: 8px;
      }
      #intro-loading .intro-icon {
        font-size: 2.8rem;
      }
      #intro-loading .loader-track {
        width: 120px;
      }
    }
  </style>
</head>
<body>

  <div id="intro-loading">

  <script>
    (function() {
      'use strict';

      var intro = document.getElementById('intro-loading');
      setTimeout(function() {
        intro.classList.add('hide');
        setTimeout(function() {
          intro.style.display = 'none';
        }, 800);
      }, 4000);

      var bgImage = document.getElementById('bgImage');

      if (bgImage) {
        bgImage.addEventListener('load', function() {
          bgImage.classList.add('loaded');
          console.log('✅ Background image loaded');
        });

        if (bgImage.complete) {
          bgImage.classList.add('loaded');
          console.log('✅ Background image already loaded');
        }

        setTimeout(function() {
          bgImage.classList.add('loaded');
        }, 5000);

        bgImage.addEventListener('error', function() {
          console.log('❌ Background image error, using fallback');
        });
      }

      var toast = document.getElementById('toast');
      var toastTimeout = null;

      function showToast(msg) {
        toast.textContent = msg || '📋 NOMBOR DISALIN!';
        toast.classList.add('show');
        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(function() {
          toast.classList.remove('show');
        }, 2200);
      }

      document.querySelectorAll('.copy-btn').forEach(function(btn) {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          var text = this.getAttribute('data-copy');
          if (!text) return;

          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text)
              .then(function() { showToast('✅ NOMBOR DISALIN!'); })
              .catch(function() { fallbackCopy(text); });
          } else {
            fallbackCopy(text);
          }
        });
      });

      function fallbackCopy(text) {
        try {
          var ta = document.createElement('textarea');
          ta.value = text;
          ta.style.cssText = 'position:fixed;opacity:0;left:-9999px;';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          showToast('✅ NOMBOR DISALIN!');
        } catch (_) {
          showToast('❌ GAGAL SALIN, SILA MANUAL.');
        }
      }

      document.querySelectorAll('.payment-card[data-toggle]').forEach(function(card) {
        var content = card.querySelector('.card-content');
        var indicator = card.querySelector('.toggle-indicator');
        if (!content || !indicator) return;

        var isOpen = false;

        card.addEventListener('click', function(e) {
          if (e.target.closest('.copy-btn') || e.target.closest('.qr-image')) return;

          if (isOpen) {
            content.classList.add('hidden');
            indicator.textContent = 'OPEN';
            card.classList.add('toggled');
          } else {
            content.classList.remove('hidden');
            indicator.textContent = 'CLOSE';
            card.classList.remove('toggled');
          }
          isOpen = !isOpen;
        });
      });

      var qrPopup = document.getElementById('qrPopup');
      var qrPopupImg = document.getElementById('qrPopupImg');
      var closeQrBtn = document.getElementById('closeQrPopup');
      var qrThumb = document.getElementById('qrThumb');

      function openQrPopup(src) {
        qrPopupImg.src = src;
        qrPopup.classList.add('open');
        document.body.style.overflow = 'hidden';
      }

      function closeQrPopup() {
        qrPopup.classList.remove('open');
        document.body.style.overflow = '';
      }

      if (qrThumb) {
        qrThumb.addEventListener('click', function(e) {
          e.stopPropagation();
          openQrPopup(this.src);
        });
      }

      if (closeQrBtn) {
        closeQrBtn.addEventListener('click', closeQrPopup);
      }

      qrPopup.addEventListener('click', function(e) {
        if (e.target === qrPopup) {
          closeQrPopup();
        }
      });

      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && qrPopup.classList.contains('open')) {
          closeQrPopup();
        }
      });

    })();
  </script>
</body>
</html>
